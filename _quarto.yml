project:
  type: default

format:
  revealjs:
    theme: [simple, quarto-styles.scss]
    slide-number: true
    width: 1600
    height: 900
    preview-links: auto
    embed-resources: true
    transition: fade
    include-after-body: section-footer.html
    title-slide-attributes:
      data-background-color: "#23373B"

from: markdown+emoji

execute:
  echo: false
